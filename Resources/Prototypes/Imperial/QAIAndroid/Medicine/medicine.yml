- type: reagent
  id: PhaseFluid
  name: reagent-name-saline
  group: Medicine
  desc: reagent-desc-saline
  physicalDesc: reagent-physical-desc-salty
  flavor: salty
  color: "#fff2d6"
  metabolisms:
    Drink:
      effects:
        - !type:SatiateThirst
          factor: 6
        - !type:ModifyBloodLevel
          amount: 6

- type: reagent
  id: CoolingPhaseFluid
  name: reagent-name-CoolingPhaseFluid
  parent: BaseDrink
  desc: reagent-desc-CoolingPhaseFluid
  slippery: true
  physicalDesc: reagent-physical-desc-translucent
  flavor: CoolingPhaseFluid
  color: "#fff2d6"
  recognizable: true
  boilingPoint: 100.0
  meltingPoint: 0.0
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 1
    Poison:
      metabolismRate: 0.5
      effects:
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: QAIAndroid
          shouldHave: false
        damage:
          types:
            Poison: 0.5

- type: metabolizerType
  id: QAIAndroid
  name: metabolizer-type-qaiandroid

#T1
- type: entity
  name: Homemade plates #Самодельные пластины
  description: A bunch of steel and plasteel sheets bonded together, welded into a single whole. It looks very unreliable, but, surprisingly, it can take root and replace the damaged parts of the skin.
  parent: BaseHealingItem
  id: QAIHomemadePlates
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    sprite: Imperial/QAIAndroid/Medical/brutepack-T1.rsi
    state: brutepack
    scale: 0.8, 0.8
  - type: Healing
    damageContainers:
      - QAIAndroid
    damage:
      groups:
        slash: -10
        blunt: -10
        piercing: -10
        Brute: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: HardTraumapack
    count: 1
  - type: StackPrice
    price: 300
  - type: Construction
    graph: HomemadePlates
    node: Plate

- type: entity
  name: Repair ointment insulator #Высокотехнологичная наноизоляционная лента
  description: The heiress of that ancient blue electrical tape, it is still used by technicians of different calibers to repair household electronics and not so much appliances. The QAI is also a toaster, and it can also be wrapped with electrical tape.
