- type: entity
  id: BaseHandheldMechAnalyzer
  parent: BaseItem
  name: mech analyzer
  description: A hand-held mech scaner.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_analyzer
    layers:
    - state: mecha_analyzer
    - state: mecha_analyzer_anim
      shader: unshaded
      visible: true
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Item
    storedRotation: -90
  - type: ActivatableUI
    key: enum.HealthAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: HealthAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
    damageContainers:
    - Mech
  - type: Tag
    tags:
    - DiscreteHealthAnalyzer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerCellSlotVisuals.Enabled:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }

- type: entity
  abstract: true
  parent: [BaseItem, PowerCellSlotSmallItem]
  id: BaseHandheldComputer
  components:
  - type: ActivatableUIRequiresPowerCell
  - type: ItemToggle
    onUse: false # above component does the toggling
  - type: PowerCellDraw
    drawRate: 0
    useRate: 20
  - type: ToggleCellDraw
