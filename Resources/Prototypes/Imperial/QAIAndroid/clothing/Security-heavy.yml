  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Sprite
    sprite: Imperial/QAIAndroid/clothing/Shell/Security-heavy.rsi
  - type: Clothing
    sprite: Imperial/QAIAndroid/clothing/Shell/Security-heavy.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.50
        Slash: 0.50
        Piercing: 0.75
        Heat: 0.60
        Shock: 0.70
        Caustic: 0.85
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
