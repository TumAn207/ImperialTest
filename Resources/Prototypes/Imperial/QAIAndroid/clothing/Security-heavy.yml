- type: entity
  parent: ClothingOuterBaseMedium
  id: Security-heavy-Armor
  name: Укреплённый корпус Службы Безопасности
  suffix: QAI
  description: Капитальная переработка корпуса андройда сб, имеет почти максимальное для действующего шасси бронирование, массу внутренних активных частей и мощный экзоскелет под дополнительными листами брони.
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Huge
    grid:
