- type: entity
  parent: ClothingOuterBaseMedium
  id: Engineering-corps
  name: Инженерный Корпус
  suffix: QAI
  description: Технический корпус предназначенный для обслуживания станционных установок благодаря повышенной защите от огня, что позволяет андройду не гореть даже в открытом пламени.
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,4,3
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Sprite
    sprite: Imperial/QAIAndroid/clothing/Shell/Engineer.rsi
  - type: Clothing
    sprite: Imperial/QAIAndroid/clothing/Shell/Engineer.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.15
        Slash: 0.15
        Piercing: 0.1
        Heat: 0.65
        Shock: 0.3
        Caustic: 0.85
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1.05
