- type: entity
  parent: ClothingOuterBaseMedium
  id: Cargo-Armor
  name: Корпус Снабжения
  suffix: QAI
  description: Наиболее простой с технической точки зрения (за исключением универсального) корпус, имеющий простые механизмы для усиления опорно-двигательной системы андройда с целью увеличения переносимого им груза.
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,4,3
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Sprite
    sprite: Imperial/QAIAndroid/clothing/Shell/Cargo.rsi
  - type: Clothing
    sprite: Imperial/QAIAndroid/clothing/Shell/Cargo.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.1
        Heat: 0.15
        Shock: 0.3
        Caustic: 0.85
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1.1
