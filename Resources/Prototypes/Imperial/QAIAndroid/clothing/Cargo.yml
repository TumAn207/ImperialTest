- type: entity
  parent: ClothingOuterBaseMedium
  id: Carso-Armor
  name: Корпус Снабжения
  suffix: QAI
  description: Наиболее простой с технической точки зрения (за исключением универсального) корпус, имеющий простые механизмы для усиления опорно-двигательной системы андройда с целью увеличения переносимого им груза.
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,2,2
  - type: Storage
    grid:
    - 0,0,4,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Sprite
    sprite: Imperial/QAIAndroid/clothing/Cargo.rsi
  - type: Clothing
    sprite: Imperial/QAIAndroid/clothing/Cargo.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.40
        Slash: 0.40
        Piercing: 0.60
        Heat: 0.85
        Cold: 0.85
        Shock: 0.75
        Caustic: 0.85
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.95
