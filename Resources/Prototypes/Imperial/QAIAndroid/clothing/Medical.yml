- type: entity
  parent: ClothingOuterBaseMedium
  id: Medical corps.
  name: Медицинский Корпус
  suffix: QAI
  description: Облегчённый корпус с встроенными сервоприводами для ускорения передвижения носящего его андройда, используется медицинской модификацией, в связи с чем покрашен в белые оттенки для быстрого опознания.
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,4,3
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Sprite
    sprite: Imperial/QAIAndroid/clothing/Medical.rsi
  - type: Clothing
    sprite: Imperial/QAIAndroid/clothing/Medical.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.25
        Shock: 0.3
        Caustic: 0.85
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1.11
