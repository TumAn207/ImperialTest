- type: entity
  parent: ClothingOuterBaseMedium
  id: CMDCorps
  name: Корпус Командования
  suffix: QAI
  description: Технический шедевр и по совместительству инженерное чудо с полной переработкой корпуса андройда - не снаружи, но внутри. Не имеет никаких ограничений, взамен не стесняет движения, позволяет переносить колоссальный вес и оставаться таким же подвижным, в связи с чем признан не только лучшим среди одноклассников, но и исключительно дорогим удовольствием.
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,4,3
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Sprite
    sprite: Imperial/QAIAndroid/clothing/Command.rsi
  - type: Clothing
    sprite: Imperial/QAIAndroid/clothing/Command.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.7
        Shock: 0.8
        Stamina: 0.6
        Explosion: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
